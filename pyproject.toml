[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cometspec"
version = "0.1.0"
description = "Fluorescence modeling and MCMC fitting for cometary spectra."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Baltasar Luco", email = "baltasarluco@uc.cl"},
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "specutils>=1.10",
    "sbpy>=0.4",
    "emcee>=3.1",
    "corner>=2.2",
    "tqdm>=4.60",
    "tables>=3.7",
    "threadpoolctl>=3.0",
    "multiprocess>=0.70",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
docs = [
    "sphinx>=7.0,<9",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
]

[project.urls]
Homepage = "https://cometspec.readthedocs.io/"
Source = "https://github.com/baltasarluco/CometSpec"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cometspec", "cometspec.*"]

[tool.setuptools.package-data]
"cometspec" = ["data/**/*.txt", "data/**/*.dat", "data/**/*.csv", "data/**/*.h5", "data/**/*.npz"]
